<!DOCTYPE html>
<html>
<head>
    <title>Minimal Menu Test</title>
    <style>
        .menu { background: #f0f0f0; padding: 10px; }
        .dropdown { display: none; background: white; border: 1px solid #ccc; }
        .dropdown.show { display: block; }
    </style>
</head>
<body>
    <div class="menu">
        <button onclick="toggleMenu()">Click Me</button>
        <div id="menu" class="dropdown">
            <p>Menu Item 1</p>
            <p>Menu Item 2</p>
        </div>
    </div>
    
    <script>
        function toggleMenu() {
            var menu = document.getElementById('menu');
            if (menu.classList.contains('show')) {
                menu.classList.remove('show');
            } else {
                menu.classList.add('show');
            }
        }
    </script>
</body>
</html>
