<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Test</title>
    <style>
        .nav-btn {
            background: #007acc;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .nav-group {
            position: relative;
            display: inline-block;
        }
        
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 160px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
            z-index: 1001;
        }

        .dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: block;
            width: 100%;
            padding: 12px 16px;
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
        }

        .dropdown-item:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>Menu Dropdown Test</h1>
    
    <div class="nav-group">
        <button class="nav-btn" id="file-menu">📁 File</button>
        <div class="dropdown" id="file-dropdown">
            <button class="dropdown-item" id="new-file">New File</button>
            <button class="dropdown-item" id="open-file">Open File</button>
            <button class="dropdown-item" id="save-file">Save File</button>
        </div>
    </div>
    
    <div class="nav-group">
        <button class="nav-btn" id="edit-menu">✏️ Edit</button>
        <div class="dropdown" id="edit-dropdown">
            <button class="dropdown-item" id="undo">Undo</button>
            <button class="dropdown-item" id="redo">Redo</button>
            <button class="dropdown-item" id="copy">Copy</button>
        </div>
    </div>

    <script>
        console.log('🔧 Menu test script starting...');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔧 DOM loaded');
            
            const navBtns = document.querySelectorAll('.nav-btn');
            console.log('🔧 Found nav buttons:', navBtns.length);
            
            navBtns.forEach((btn, index) => {
                console.log(`🔧 Setting up button ${index}:`, btn.id);
                
                btn.addEventListener('click', function(e) {
                    console.log('🔧 Button clicked:', btn.id);
                    e.stopPropagation();
                    
                    const dropdown = btn.nextElementSibling;
                    console.log('🔧 Found dropdown:', dropdown?.classList.contains('dropdown'));
                    
                    if (dropdown && dropdown.classList.contains('dropdown')) {
                        // Close other dropdowns
                        document.querySelectorAll('.dropdown').forEach(d => {
                            if (d !== dropdown) {
                                d.classList.remove('show');
                            }
                        });
                        
                        // Toggle current dropdown
                        dropdown.classList.toggle('show');
                        console.log('🔧 Dropdown toggled, show class:', dropdown.classList.contains('show'));
                    }
                });
            });
            
            // Close dropdowns when clicking outside
            document.addEventListener('click', function() {
                console.log('🔧 Outside click - closing dropdowns');
                document.querySelectorAll('.dropdown').forEach(dropdown => {
                    dropdown.classList.remove('show');
                });
            });
            
            console.log('🔧 Menu test setup complete');
        });
    </script>
</body>
</html>
