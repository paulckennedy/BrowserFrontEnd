services:
  # Markdown Editor Web Application (Frontend Only)
  markdown-editor:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: markdown-editor-app
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    volumes:
      - ./logs:/var/log/nginx
    networks:
      - markdown_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.markdown-editor.rule=Host(`localhost`)"
      - "traefik.http.services.markdown-editor.loadbalancer.server.port=80"

networks:
  markdown_network:
    driver: bridge