version: '3.8'

services:
  # Markdown Editor Web Application
  markdown-editor:
    build: .
    container_name: markdown-editor-app
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://markdown_user:markdown_pass@postgres:5432/markdown_editor
      - REDIS_URL=redis://redis:6379
    volumes:
      - app_data:/app/data
      - ./logs:/var/log/nginx
    depends_on:
      - postgres
      - redis
    networks:
      - markdown_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.markdown-editor.rule=Host(`localhost`)"
      - "traefik.http.services.markdown-editor.loadbalancer.server.port=80"

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: markdown-editor-db
    environment:
      - POSTGRES_USER=markdown_user
      - POSTGRES_PASSWORD=markdown_pass
      - POSTGRES_DB=markdown_editor
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database/backup:/backup
    ports:
      - "5432:5432"
    networks:
      - markdown_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markdown_user -d markdown_editor"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    container_name: markdown-editor-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - markdown_network
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Reverse proxy for production
  traefik:
    image: traefik:v2.10
    container_name: markdown-editor-proxy
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik:ro
    networks:
      - markdown_network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_data:
    driver: local

networks:
  markdown_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16